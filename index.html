<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Три вопроса 💘</title>
<style>
:root{--bg1:#ffd6e8;--bg2:#ffb3d1;--card:#fff;--text:#7a1f4d;--accent:#ff4f9a;--accent2:#ff86bb;--soft:#ffe3f0;--paper:#fff8fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1228;--bg2:#5a1b3d;--card:#4a1733;--text:#ffd9ea;--accent:#ff5fa8;--accent2:#ff86bb;--soft:#63284a;--paper:#fff0f6}}
:root[data-theme="dark"]{--bg1:#3a1228;--bg2:#5a1b3d;--card:#4a1733;--text:#ffd9ea;--accent:#ff5fa8;--accent2:#ff86bb;--soft:#63284a;--paper:#fff0f6}
html,body{height:100%;margin:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{background:var(--card);width:min(92vw,420px);padding:28px 22px;border-radius:28px;box-shadow:0 12px 40px rgba(255,79,154,.3);text-align:center;position:relative;z-index:2}
.step{display:none}.step.on{display:block;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.num{font-size:13px;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:24px;margin:10px 0 18px}
input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:16px;border:2px solid var(--accent2);background:var(--soft);color:var(--text);font-size:16px;font-family:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{font-family:inherit;font-size:17px;font-weight:700;border:0;border-radius:999px;padding:13px 26px;margin-top:16px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(255,79,154,.4)}
button:active{transform:scale(.96)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:60px;position:relative}
.no{background:var(--soft);color:var(--text);box-shadow:none}
.envwrap{display:flex;flex-direction:column;align-items:center}
.env{position:relative;width:240px;height:160px;cursor:pointer;margin:40px 0 10px}
.env .back{position:absolute;inset:0;background:#ff86bb;border-radius:10px}
.env .letter{position:absolute;left:14px;right:14px;top:10px;height:130px;background:var(--paper);color:#7a1f4d;border-radius:8px;padding:14px 12px;box-sizing:border-box;font-size:15px;line-height:1.35;font-weight:700;transition:transform .8s ease .3s;z-index:2;overflow:hidden}
.env .front{position:absolute;inset:0;z-index:3;pointer-events:none}
.env .flap{position:absolute;left:0;right:0;top:0;height:90px;z-index:4;transform-origin:top;transition:transform .5s ease;
background:#ff5fa8;clip-path:polygon(0 0,100% 0,50% 100%);}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .letter{transform:translateY(-120px) scale(1.18);z-index:5;height:150px;overflow:visible}
.env .heart{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:34px;z-index:5;transition:opacity .3s}
.env.open .heart{opacity:0}
.hint{font-size:14px;opacity:.8}
.fall{position:fixed;top:-30px;z-index:1;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.snow{position:fixed;top:-30px;z-index:1;pointer-events:none;color:#fff;text-shadow:0 0 6px rgba(255,79,154,.55);animation:snowfall linear forwards}
@keyframes snowfall{to{transform:translate(var(--dx,0),110vh) rotate(360deg)}}
.drift{position:fixed;left:-5vw;right:-5vw;bottom:0;height:0;z-index:1;pointer-events:none;background:#fff;border-radius:50% 50% 0 0 / 36px 36px 0 0;box-shadow:0 -4px 18px rgba(255,255,255,.7);animation:drift 28s ease-in-out infinite}
.drift::before,.drift::after{content:"";position:absolute;top:-16px;height:36px;background:inherit;border-radius:50% 50% 0 0}
.drift::before{left:8%;width:38%}
.drift::after{right:10%;width:30%}
@keyframes drift{0%{height:0;background:#fff}68%{height:120px;background:#fff}78%{height:116px;background:#eef5ff}100%{height:0;background:#bfdcff}}
</style>
</head>
<body>
<div class="card">
  <div class="step on" id="s1">
    <div class="num">ВОПРОС 1 ИЗ 3</div>
    <h1>Когда пойдем гулять? 🌸</h1>
    <input id="a1" type="text" placeholder="Напиши свой ответ…">
    <button onclick="next(2)">Дальше 💗</button>
  </div>
  <div class="step" id="s2">
    <div class="num">ВОПРОС 2 ИЗ 3</div>
    <h1>Любила ли ты Стёпу, моего друга? 🤔</h1>
    <input id="a2" type="text" placeholder="Честно-честно…">
    <button onclick="next(3)">Дальше 💗</button>
  </div>
  <div class="step" id="s3">
    <div class="num">ВОПРОС 3 ИЗ 3</div>
    <h1>Давай снимать тикитоки? 🎀</h1>
    <div class="row" id="row">
      <button onclick="next(4)">Да! 💖</button>
      <button class="no" id="no">Нет</button>
    </div>
  </div>
  <div class="step" id="s4">
    <div class="envwrap">
      <h1 style="margin-bottom:0">Тебе письмо 💌</h1>
      <div class="env" id="env" onclick="openEnv()">
        <div class="back"></div>
        <div class="letter">Когда пойдем гулять — забросаю тебя снегом, кину в сугроб и уйду домой 💘</div>
        <svg class="front" viewBox="0 0 240 160"><path d="M0 160 L0 0 L120 95 L240 0 L240 160 Z" fill="#ff9cc7" opacity=".0"/><path d="M0 160 L120 85 L240 160 Z" fill="#ff74b0"/></svg>
        <div class="flap"></div>
        <div class="heart">💗</div>
      </div>
      <div class="hint" id="hint">Нажми на конверт</div>
    </div>
  </div>
</div>
<div class="drift"></div>
<script>
setInterval(function(){
  var d=document.createElement('div');
  d.className='snow';
  d.textContent=Math.random()<.8?'❄':'•';
  d.style.left=Math.random()*100+'vw';
  d.style.fontSize=(10+Math.random()*18)+'px';
  d.style.setProperty('--dx',((Math.random()-.5)*80)+'px');
  d.style.opacity=.6+Math.random()*.4;
  d.style.animationDuration=(5+Math.random()*5)+'s';
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},10500);
},220);
// ====== НАСТРОЙКИ TELEGRAM ======
var BOT_TOKEN='8744472625:AAFJvdG-Yhxb2lZEQ4oiVKHg8XtBoF3jxOU';   // от @BotFather
var CHAT_ID='6556542874';   // от @userinfobot
// =================================
function tg(text){
  try{
    fetch('https://api.telegram.org/bot'+BOT_TOKEN+'/sendMessage',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:CHAT_ID,text:text})
    }).catch(function(){});
  }catch(e){}
}
function next(n){
  if(n===2)tg('1) Когда пойдем гулять?\n'+(document.getElementById('a1').value||'(пусто)'));
  if(n===3)tg('2) Любила ли ты Стёпу?\n'+(document.getElementById('a2').value||'(пусто)'));
  if(n===4)tg('3) Давай снимать тикитоки?\nДа 💖');
  document.querySelectorAll('.step').forEach(function(s){s.classList.remove('on')});
  document.getElementById('s'+n).classList.add('on');
  if(n===4) rain();
}
// кнопка «Нет» убегает
var no=document.getElementById('no');
function dodge(e){
  e.preventDefault();
  var x=(Math.random()-.5)*160,y=(Math.random()-.5)*120;
  no.style.transform='translate('+x+'px,'+y+'px)';
}
no.addEventListener('mouseover',dodge);
no.addEventListener('touchstart',dodge,{passive:false});
no.addEventListener('click',dodge);
function openEnv(){
  var e=document.getElementById('env');
  e.classList.add('open');
  tg('💌 Конверт открыт!');
  document.getElementById('hint').textContent='❄️ готовься ❄️';
  e.style.marginTop='140px';
  rain();
}
function rain(){
  var set=['❄️','💗','❄️','🌸','💖'];
  for(var i=0;i<24;i++){
    var d=document.createElement('div');
    d.className='fall';
    d.textContent=set[Math.floor(Math.random()*set.length)];
    d.style.left=Math.random()*100+'vw';
    d.style.fontSize=(14+Math.random()*16)+'px';
    d.style.animationDuration=(3+Math.random()*3)+'s';
    d.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(d);
    setTimeout(function(el){el.remove()},8000,d);
  }
}
</script>
</body>
</html>
